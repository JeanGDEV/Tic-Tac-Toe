<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="player-container">
            <div class="player">
                <p>Player 1:</p>
                <span>John</span>
            </div>
            <div class="player">
                <p>Player 2:</p>
                <span>Doe</span>
            </div>
        </div>
        <div class="buttons">
            <button>Start</button>
            <button>Restart</button>
        </div>
        <div class="gameboard">
            <div class="square"><span>X</span></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
